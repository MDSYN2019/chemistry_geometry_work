[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aldc-cl-br-rbfe"
version = "0.1.0"
description = "Reproducible structural groundwork for an ALDC Cl-to-Br RBFE study"
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest>=7"]
md = ["openmm>=8"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]
